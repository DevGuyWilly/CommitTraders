<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Filled in per page by the server (src/services/seo.service.ts): title, description, canonical, Open Graph, JSON-LD. -->
    <!--app-head-->
    <!--
      The server puts a crawlable copy of the page in #seo-snapshot for search engines. Keep it in the
      page but out of sight — visible, it flashes as an unstyled page until React replaces it. With
      JavaScript off there is no React, so the noscript rule shows it instead.
    -->
    <style>
      #seo-snapshot {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
    <!--
      Splash screen: pure HTML/CSS so it paints before any JavaScript arrives. It fades in after a short
      delay (a fast load never shows it), React removes it once the first data is in (lib/splash.ts), and
      a CSS failsafe stops it covering the page if the app never starts.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0b0e;
        opacity: 1;
        transition: opacity 0.4s ease;
        animation: splash-failsafe 0s linear 8s forwards;
      }
      #splash.splash-done {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        opacity: 0;
        animation: splash-in 0.45s ease 0.15s forwards;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(0.5rem);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .splash-logo {
        position: relative;
        display: grid;
        place-items: center;
      }
      .splash-glow {
        position: absolute;
        width: 13rem;
        height: 13rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 162, 78, 0.2), transparent 65%);
        animation: splash-glow 2.4s ease-in-out infinite;
      }
      @keyframes splash-glow {
        0%, 100% {
          opacity: 0.35;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
      .splash-mark {
        position: relative;
        width: 3.5rem;
        height: 3.5rem;
        color: #d4a24e;
      }
      /* pathLength="1" normalises both strokes, so 1 = fully hidden and 0 = fully drawn. */
      .splash-mark path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: splash-trace 2.4s ease-in-out infinite;
      }
      .splash-mark path + path {
        animation-delay: 0.35s;
      }
      @keyframes splash-trace {
        0% {
          stroke-dashoffset: 1;
        }
        45%, 55% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -1;
        }
      }
      .splash-name {
        font: 600 1.0625rem/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.04em;
        color: #f4f5f7;
      }
      .splash-bar {
        width: 6rem;
        height: 2px;
        overflow: hidden;
        border-radius: 1px;
        background: rgba(255, 255, 255, 0.08);
      }
      .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #d4a24e;
        animation: splash-sweep 1.4s ease-in-out infinite;
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
        .splash-inner {
          animation-duration: 0.01s;
        }
        .splash-glow,
        .splash-bar::after,
        .splash-mark path {
          animation: none;
        }
        .splash-mark path {
          stroke-dashoffset: 0;
        }
        .splash-bar::after {
          width: 100%;
        }
      }
    </style>
    <noscript>
      <style>
        #splash {
          display: none;
        }
        #seo-snapshot {
          position: static;
          width: auto;
          height: auto;
          overflow: visible;
          clip: auto;
          white-space: normal;
        }
      </style>
    </noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-logo">
          <span class="splash-glow"></span>
          <svg class="splash-mark" viewBox="0 0 24 24" fill="none">
            <path pathLength="1" d="M3 16L9.5 9.5L13.5 13.5L21 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            <path pathLength="1" d="M15 5H21V11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <span class="splash-name">CommitTraders</span>
        <span class="splash-bar"></span>
      </div>
    </div>
    <!-- The server puts the crawlable copy (#seo-snapshot) here; React replaces it on mount. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
